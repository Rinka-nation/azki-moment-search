# --- AZKi が付けた名前（2026-11-07 霧島リンカさん） ---
# 主人公 クロノ → アズノ、魔王 → AZ魔王、シルバード → アズバード。
# エイラは名前の上 2 文字で呼ぶので アズノ は「アズ」。字幕の「あずたち」は「アズたち」（あずきち ではない）
[[term]]
canonical = "アズノ"
reading = "あずの"
category = "game"

[[term]]
canonical = "AZ魔王"
reading = "あずまおう"
aliases = ["アズ魔王", "あず魔王", "アズマ王", "アスマ王", "あズマ王", "アズマお"]
category = "game"

[[term]]
canonical = "アズバード"
reading = "あずばーど"
category = "game"

[[term]]
canonical = "アズたち"
reading = "あずたち"
aliases = ["あずたち"]
category = "game"
