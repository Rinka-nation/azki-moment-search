# マリオテニス の配信の語。このゲームの配信（タイトルに title_patterns のどれかがある）でだけ補正に使う。

[game]
id = "mario_tennis"
name = "マリオテニス"
title_patterns = ["マリオテニス"]

# 兎田ぺこらが講師の「兎田塾」（ぺこら塾 とも呼ぶ）。字幕では「う田塾」「うさ田塾」になる。
# AI修正 が ぺこら塾 にしていたものを、手で直さず辞書に移した（2026-11-09 霧島リンカさん）。
# 「田塾」は 津田塾 なども変えてしまうので alias にしない
[[term]]
canonical = "兎田塾"
reading = "うさだじゅく"
aliases = ["う田塾", "うさ田塾", "う座塾"]
category = "game"
