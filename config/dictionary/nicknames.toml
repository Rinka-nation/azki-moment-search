# AZKi がホロメンを呼ぶときの呼び名（出典: 非公式 wiki「AZKi【呼称一覧】」2026-10 時点）
# group = 誰のことか（将来の「関連語も含めて検索」で使う）。
# 普通の言葉と同じ呼び名（船長、団長、社長、会長、番長、風真、ござる、さかまた 等）は入れていない。
# fuzzy = false: 短い呼び名はあいまい一致の候補が誤検出になりやすい（読みでの検索は効く）。
# 既に hololive.toml にあるもの（そらちゃん、すいちゃん、みこち、フブちゃん、はあちゃま、アキロゼ、
# ござるさん、ぺこーら、リオナ、ロボ子さん）はそちらを参照。

[[term]]
canonical = "そら先輩"
reading = "そらせんぱい"
group = "ときのそら"
category = "nickname"
# AZKi が そら先輩 と呼んだのは初期だけ。今はコラボ相手の発言として拾われるくらいなので、
# ときのそらが配信の話題のときだけ補正する（2026-10-30）
topic_only = true
# AZKi はほとんど言わず、候補（じ先輩・あ先輩）は誤りばかりなので探さない。採用済みの alias は残す（2026-11-03）
fuzzy = false

