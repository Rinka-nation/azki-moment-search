[[term]]
canonical = "かなけん"
reading = "かなけん"
# 金券・カナけ・カラケン: かなけん配信 21 本の字幕調査で見つかった崩れ方（2026-10-30）
aliases = ["カナケン", "かナけん", "かな県", "カナケ", "金券", "カナけ", "カラケン"]
category = "unit"
# AZKi・天音かなた・沙花叉クロヱのユニット（2026-10-29 ユーザー提供）

# かけん（ナの欠落）は「かける」の口語（水かけんの?、迷惑かけんなよ）とぶつかる。
# 字幕の 27 件をユーザーと確認して決めた（2026-10-30）。仕組みは rules.py
[[term.rules]]
surfaces = ["かけん", "カケン"]
after = ["ライブ", "社員", "家族", "推し", "ロケ"]
not_before = ["水", "声", "話し", "迷惑", "掛け", "いくら", "[にもを]", "[0-9０-９]"]
not_after = ["の[?？]", "のか", "なよ", "な[。、]", "んで", "で[くき]", "だろ"]
topic = ["かなけん", "かなた建設", "天音かなた", "沙花叉クロヱ"]

# かなけ（ンの欠落）は挨拶（こんかなけん・おつかなけん）の形だけ。長引かなければ のような普通の言葉が多い
[[term.rules]]
surfaces = ["かなけ"]
before = ["こん", "おつ"]
not_after = ["ん"]
otherwise = "keep"

